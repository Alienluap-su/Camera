name: Create signing key (run once)
on: workflow_dispatch
jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate key
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -keystore ks.p12 -storetype PKCS12 -alias alienluap -keyalg RSA -keysize 4096 -validity 36500 -storepass "$PASS" -keypass "$PASS" -dname "CN=Alienluap, O=Alienluap"
          base64 -w0 ks.p12 > keystore_base64.txt
          echo -n "$PASS" > keystore_password.txt
      - uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: |
            keystore_base64.txt
            keystore_password.txt
